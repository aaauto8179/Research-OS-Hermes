version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: research-os-postgres
    environment:
      POSTGRES_DB: research_os
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research_local_dev
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: research-os-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant/data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: research-os-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama/models:/root/.ollama/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # If no GPU, remove deploy section and use CPU (slower)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: pgAdmin for DB UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: research-os-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@research-os.local
      PGADMIN_DEFAULT_PASSWORD: admin_local
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - ./pgadmin:/var/lib/pgadmin